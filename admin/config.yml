backend:
  name: github
  repo: hauptcc-svg/whatsmyglucose
  branch: main
  base_url: https://api.sveltia.app
  auth_endpoint: auth

media_folder: "images"
public_folder: "/images"

collections:
  - name: "settings"
    label: "Site Settings"
    files:

      # ─── HERO SECTION ──────────────────────────────────────────────────────
      - name: "hero"
        label: "🏠 Hero Section"
        file: "content/hero.json"
        format: json
        fields:
          - label: "Doctor kicker line"
            name: "hero_kicker"
            widget: "string"
            hint: "Small line above the main heading — e.g. Dr. Janny Myburg · MBChB"

          - label: "Tagline (script text)"
            name: "hero_script"
            widget: "string"
            hint: "Italic script line — e.g. Understand your body. Take control."

          - label: "Hero description"
            name: "hero_desc"
            widget: "text"
            hint: "Short paragraph under the tagline"

          - label: "Primary button text"
            name: "hero_btn1_text"
            widget: "string"
            hint: "e.g. View Courses"

          - label: "Primary button URL"
            name: "hero_btn1_url"
            widget: "string"
            hint: "e.g. Udemy course link"

      # ─── DOCTOR PROFILE ────────────────────────────────────────────────────
      - name: "doctor"
        label: "👩‍⚕️ Doctor Profile"
        file: "content/doctor.json"
        format: json
        fields:
          - label: "Profile photo"
            name: "doctor_photo"
            widget: "image"
            hint: "Upload a new photo of Dr. Janny — recommended size 600×700px"

          - label: "Doctor name"
            name: "doctor_name"
            widget: "string"
            hint: "e.g. Dr. Janny Myburg"

          - label: "Credentials line"
            name: "doctor_credentials"
            widget: "string"
            hint: "e.g. MBChB · Diploma in Mental Health"

          - label: "Bio paragraph 1"
            name: "bio_p1"
            widget: "text"

          - label: "Bio paragraph 2"
            name: "bio_p2"
            widget: "text"

      # ─── SERVICES ──────────────────────────────────────────────────────────
      - name: "services"
        label: "🛠️ Services (What We Offer)"
        file: "content/services.json"
        format: json
        fields:
          - label: "Service 1 title"
            name: "service1_title"
            widget: "string"
            hint: "e.g. Online Course — Understand Your Glucose"

          - label: "Service 2 title"
            name: "service2_title"
            widget: "string"
            hint: "e.g. Personal Consultation with Dr. Janny"

          - label: "Service 3 title"
            name: "service3_title"
            widget: "string"
            hint: "e.g. Digital Resources on Gumroad"

          - label: "Service 4 title"
            name: "service4_title"
            widget: "string"
            hint: "e.g. Free Starter Guide"

      # ─── GROUP PROGRAMME ────────────────────────────────────────────────────
      - name: "group"
        label: "👥 Group Programme (changes monthly)"
        file: "content/group.json"
        format: json
        fields:
          - label: "Group Month & Year"
            name: "group_month"
            widget: "string"
            hint: "e.g. June 2026 — appears in headings and buttons"

          - label: "Status Badge (top of card)"
            name: "group_status_badge"
            widget: "string"
            hint: "e.g. Starting Soon  |  Now Open  |  Waitlist Only"

          - label: "Card Title"
            name: "group_card_title"
            widget: "string"
            hint: "e.g. JUNE 2026 GROUP"

          - label: "Availability Line"
            name: "group_availability"
            widget: "string"
            hint: "e.g. Limited spaces — applications open now"

          - label: "Left-side description"
            name: "group_left_desc"
            widget: "text"

          - label: "Left-side bullet points"
            name: "group_left_bullets"
            widget: "list"
            field:
              label: "Bullet"
              name: "bullet"
              widget: "string"

          - label: "Card intro sentence"
            name: "group_intro"
            widget: "string"

          - label: "What's included (card list)"
            name: "group_includes"
            widget: "list"
            field:
              label: "Item"
              name: "item"
              widget: "string"

          - label: "Price"
            name: "group_price"
            widget: "string"
            hint: "e.g. R500"

          - label: "Price note"
            name: "group_price_note"
            widget: "text"
            hint: "Small text under the price"

          - label: "Urgency title"
            name: "group_urgency_title"
            widget: "string"

          - label: "Urgency subtitle"
            name: "group_urgency_sub"
            widget: "string"

          - label: "Applications Open?"
            name: "applications_open"
            widget: "boolean"
            default: true
            hint: "Toggle OFF to swap Apply button for Join Waitlist"

          - label: "Apply / Waitlist button URL"
            name: "group_apply_url"
            widget: "string"
            hint: "MailerLite form URL"

          - label: "Apply button text"
            name: "group_apply_btn_text"
            widget: "string"

          - label: "Join button text (left side)"
            name: "group_join_btn_text"
            widget: "string"

          - label: "Group description (used in CTA)"
            name: "group_description"
            widget: "text"

      # ─── CONTACT & WHATSAPP ─────────────────────────────────────────────────
      - name: "general"
        label: "📱 Contact & WhatsApp"
        file: "content/general.json"
        format: json
        fields:
          - label: "WhatsApp Number (digits only, include country code)"
            name: "whatsapp_number"
            widget: "string"
            hint: "e.g. 27825332623  (27 = South Africa)"

          - label: "WhatsApp Pre-fill Message"
            name: "whatsapp_message"
            widget: "text"
            hint: "Message that auto-fills when someone taps WhatsApp"

      # ─── CTA SECTION ────────────────────────────────────────────────────────
      - name: "cta"
        label: "📣 Call to Action Section"
        file: "content/cta.json"
        format: json
        fields:
          - label: "CTA Heading"
            name: "cta_heading"
            widget: "string"
            hint: "e.g. READY TO UNDERSTAND YOUR BODY?"

          - label: "CTA Description"
            name: "cta_lead"
            widget: "text"
            hint: "Short paragraph under the CTA heading"

      # ─── SEO & SOCIAL ────────────────────────────────────────────────────────
      - name: "seo"
        label: "🔍 SEO & Social Preview"
        file: "content/seo.json"
        format: json
        fields:
          - label: "Page title (browser tab + WhatsApp/Facebook preview)"
            name: "seo_title"
            widget: "string"
            hint: "e.g. What's My Glucose – Dr. Janny Myburg"

          - label: "Meta description (shown in Google + social previews)"
            name: "seo_description"
            widget: "text"
            hint: "Keep under 160 characters for best results"

          - label: "Social preview image"
            name: "seo_og_image"
            widget: "image"
            hint: "Image shown when sharing the link on WhatsApp, Facebook, etc. — 1200×630px recommended"
"

      # ─── RESOURCES PAGE ─────────────────────────────────────────────────────
      - name: "resources"
        label: "📚 Resources Page (Courses & Guides)"
        file: "content/resources.json"
        format: json
        fields:

          - label: "Page hero heading"
            name: "resources_hero_heading"
            widget: "string"
            hint: "Big heading at top of Courses & Guides page"

          - label: "Page hero description"
            name: "resources_hero_desc"
            widget: "text"
            hint: "Short line under the heading"

          - label: "Courses section heading"
            name: "courses_section_heading"
            widget: "string"
            default: "Online Courses"

          - label: "Online Courses"
            name: "courses"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - label: "Course title"
                name: "title"
                widget: "string"
              - label: "Star rating"
                name: "rating"
                widget: "string"
                hint: "e.g. 4.9"
              - label: "Course description"
                name: "description"
                widget: "text"
              - label: "Udemy URL"
                name: "url"
                widget: "string"
              - label: "Thumbnail image URL"
                name: "thumbnail"
                widget: "string"
                required: false
                hint: "Paste the Udemy course image URL (or leave blank)"

          - label: "Udemy profile URL (View all courses link)"
            name: "udemy_profile_url"
            widget: "string"
            hint: "https://www.udemy.com/user/janny-myburg/"

          - label: "PDFs section heading"
            name: "pdfs_section_heading"
            widget: "string"
            default: "Medical Guides & PDFs"

          - label: "PDFs section description"
            name: "pdfs_section_desc"
            widget: "text"
            hint: "Intro text above the PDF cards"

          - label: "PDF Guides"
            name: "pdfs"
            widget: "list"
            summary: "{{fields.title}} — {{fields.price}}"
            fields:
              - label: "Guide title"
                name: "title"
                widget: "string"
              - label: "Price"
                name: "price"
                widget: "string"
                hint: "e.g. R50 or R99"
              - label: "Pay what you want?"
                name: "pwyw"
                widget: "boolean"
                default: false
                hint: "Shows 'Pay what you want' below the price badge"
              - label: "Gumroad URL"
                name: "url"
                widget: "string"
                hint: "e.g. https://jannyburg.gumroad.com/l/knmcim"
              - label: "Cover image URL"
                name: "thumbnail"
                widget: "string"
                required: false
                hint: "Paste the Gumroad product cover image URL (or leave blank)"

          - label: "Blog section heading"
            name: "blog_section_heading"
            widget: "string"
            default: "From the Blog"

          - label: "Blog section description"
            name: "blog_section_desc"
            widget: "text"

          - label: "Blog website URL (Visit the Blog button)"
            name: "blog_url"
            widget: "string"
            hint: "e.g. https://jam4joy.com"

          - label: "Blog RSS feed URL"
            name: "blog_rss_url"
            widget: "string"
            hint: "e.g. htt